<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watch Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg: #16171C;
    --surface: #1E2027;
    --surface-2: #262832;
    --text: #EDEDF0;
    --text-dim: #9A9BA5;
    --border: #2E313C;
    --film: #D6A24C;
    --serie: #4FA6A6;
    --anime: #C46B8A;
    --radius: 10px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  html[data-theme="light"]{
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface-2: #EFEDE8;
    --text: #1D1E22;
    --text-dim: #6B6C74;
    --border: #E2E0DA;
    --film: #B9812F;
    --serie: #2C7A7A;
    --anime: #A5486A;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  button{font-family:inherit;}
  .app{max-width:1080px;margin:0 auto;padding:20px 20px 80px;}

  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--film),var(--anime));
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;color:#16171C;font-size:16px;
  }
  .brand h1{font-size:20px;margin:0;}
  .icon-btn{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:17px;transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--serie); outline-offset:2px;
  }

  /* Tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tab{
    background:none;border:none;color:var(--text-dim);padding:10px 6px;margin-right:18px;
    font-size:15px;font-weight:600;cursor:pointer;position:relative;top:1px;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--text);}
  .tab .count{color:var(--text-dim);font-weight:500;font-size:13px;margin-left:5px;}

  /* Filters */
  .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .chip{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:500;
  }
  .chip.active{color:var(--bg);border-color:transparent;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .search-row{margin-bottom:14px;}
  .search-input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;
  }
  .sort-select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;
  }
  .add-btn{
    border:none;color:#16171C;padding:9px 16px;border-radius:10px;font-weight:600;
    cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;
  }

  /* Grid */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .card:active{transform:scale(0.97);box-shadow:var(--shadow);}
  .poster-wrap{position:relative;width:100%;aspect-ratio:2/3;background:var(--surface-2);overflow:hidden;}
  .poster-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s ease;}
  .poster-skeleton{
    position:absolute;inset:0;
    background:linear-gradient(100deg, var(--surface-2) 30%, var(--surface) 50%, var(--surface-2) 70%);
    background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .poster-placeholder{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:12px;text-align:center;padding:8px;
  }
  .status-dot{
    position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;
    box-shadow:0 0 0 2px rgba(0,0,0,0.35);
  }
  .card-info{padding:9px 10px 11px;}
  .card-title{font-size:13.5px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-dim);border:1px dashed var(--border);
    border-radius:var(--radius);
  }
  .empty-state .display{color:var(--text);font-size:19px;margin-bottom:6px;}
  .empty-icon{color:var(--text-dim);opacity:.6;margin-bottom:14px;display:flex;justify-content:center;}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;
  }
  @media(min-width:640px){
    .modal-overlay{align-items:center;}
  }
  .modal{
    background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:20px;border:1px solid var(--border);
  }
  @media(min-width:640px){ .modal{border-radius:16px;} }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h2{font-size:18px;margin:0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input[type=text], .field input[type=password], .field textarea, .field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .hint{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.5;}
  .hint a{color:var(--serie);}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn{
    flex:1;padding:11px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  }
  .btn.primary{border:none;color:#16171C;}
  .btn.danger{border:1px solid #c0546b;color:#e07890;background:transparent;}

  .search-results{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:340px;overflow-y:auto;}
  .search-result{
    display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:8px;cursor:pointer;text-align:left;
  }
  .search-result img{width:38px;height:56px;object-fit:cover;border-radius:5px;background:var(--bg);flex-shrink:0;}
  .search-result .no-img{width:38px;height:56px;border-radius:5px;background:var(--bg);flex-shrink:0;}
  .search-result-title{font-size:13.5px;font-weight:600;}
  .search-result-year{font-size:12px;color:var(--text-dim);}

  .segmented{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .segmented button{flex:1;background:var(--surface-2);border:none;color:var(--text-dim);padding:9px 0;font-size:13px;font-weight:600;cursor:pointer;}
  .segmented button.active{background:var(--serie);color:#fff;}

  .theme-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;width:fit-content;}
  .theme-toggle button{background:var(--surface-2);border:none;color:var(--text-dim);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .theme-toggle button.active{background:var(--text);color:var(--bg);}

  .loading-row{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:13px;padding:10px 0;}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--text-dim);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (prefers-reduced-motion: reduce){
    .card, .icon-btn{transition:none;}
    .poster-skeleton{animation:none;}
  }
</style>
</head>
<body>
<div id="root">
  <div style="padding:60px 24px;text-align:center;color:#9A9BA5;font-family:system-ui,sans-serif;">
    Caricamento di Watch Tracker...
  </div>
</div>
<script>
  window.addEventListener('error', function(e){
    var root = document.getElementById('root');
    if (root && !root.dataset.mounted) {
      root.innerHTML = '<div style="padding:40px 24px;text-align:center;color:#EDEDF0;font-family:system-ui,sans-serif;max-width:420px;margin:0 auto;">' +
        '<div style="font-size:17px;font-weight:600;margin-bottom:10px;">Impossibile caricare l\'app</div>' +
        '<div style="font-size:14px;line-height:1.6;color:#9A9BA5;">Serve una connessione internet per scaricare React la prima volta. Controlla la connessione e ricarica la pagina.<br><br>Dettaglio tecnico: ' + (e.message || 'errore sconosciuto') + '</div></div>';
    }
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const TYPES = [
  { key: 'film', label: 'Film', accent: 'var(--film)' },
  { key: 'serie', label: 'Serie TV', accent: 'var(--serie)' },
  { key: 'anime', label: 'Anime', accent: 'var(--anime)' },
];
const STATUS = {
  completato: { label: 'Completato', color: '#6FB56F' },
  watchlist: { label: 'Watchlist', color: '#8B8D98' },
};

const STORAGE_KEY = 'watchTracker.items';
const SETTINGS_KEY = 'watchTracker.settings';

function loadItems(){
  try {
    const items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    // Migrazione: lo stato "in_corso" non esiste più, gli item che lo avevano
    // tornano in watchlist (non ancora completati).
    return items.map(i => i.status === 'in_corso' ? { ...i, status: 'watchlist' } : i);
  } catch(e){ return []; }
}
function loadSettings(){
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { theme: 'dark', tmdbApiKey: '', geminiApiKey: '' }; }
  catch(e){ return { theme: 'dark', tmdbApiKey: '', geminiApiKey: '' }; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Icone SVG (stroke 1.8, coerenti con lo stile editoriale dell'app) al posto delle emoji.
function IconSettings(){

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  );
}
function IconDice(){
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4"></rect>

function IconFilmReel(){
  return (
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <circle cx="12" cy="12" r="2.4"></circle>

      <circle cx="18.1" cy="9" r="1.3"></circle>
      <circle cx="15.8" cy="16.3" r="1.3"></circle>
      <circle cx="8.2" cy="16.3" r="1.3"></circle>
      <circle cx="5.9" cy="9" r="1.3"></circle>
    </svg>

}

// TMDB (themoviedb.org) ha il catalogo di poster più curato e uniforme, ma richiede una
// API key gratuita (impostazioni ⚙ → "Chiave API TMDB"). Se la chiave non è configurata,
// o se TMDB non risponde, si torna automaticamente alle fonti precedenti (nessuna richiede key).
const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
async function searchTMDB(query, kind, apiKey){
  const url = `https://api.themoviedb.org/3/search/${kind}?query=${encodeURIComponent(query)}&api_key=${encodeURIComponent(apiKey)}&language=it-IT&include_adult=false`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('TMDB ha risposto con errore ' + res.status);
  const data = await res.json();
  return (data.results || []).map(r => ({
    title: kind === 'movie' ? r.title : r.name,
    year: (kind === 'movie' ? r.release_date : r.first_air_date || '').slice(0,4),
    cover: r.poster_path ? (TMDB_IMG + r.poster_path) : null,
  })).filter(r => r.title);
}
// Gli anime su TMDB sono catalogati come film o serie TV "Animazione": /search/multi
// cerca in entrambi insieme e mettiamo in cima i risultati con genere Animazione (id 16).
async function searchAnimeTMDB(query, apiKey){
  const url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(query)}&api_key=${encodeURIComponent(apiKey)}&language=it-IT&include_adult=false`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('TMDB ha risposto con errore ' + res.status);
  const data = await res.json();
  return (data.results || [])
    .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
    .map(r => ({
      title: r.media_type === 'movie' ? r.title : r.name,
      year: (r.media_type === 'movie' ? r.release_date : r.first_air_date || '').slice(0,4),
      cover: r.poster_path ? (TMDB_IMG + r.poster_path) : null,
      isAnimation: !!(r.genre_ids && r.genre_ids.includes(16)),
    }))
    .filter(r => r.title)
    .sort((a,b) => (b.isAnimation - a.isAnimation));
}

// Fonti di riserva, nessuna richiede API key: usate quando TMDB non è configurato o fallisce.
// Wikipedia (con origin=* per CORS ufficiale) copre praticamente ogni film, anche se non è "in vendita"
// da nessuna parte — a differenza del catalogo iTunes, che indicizza solo titoli attualmente acquistabili.
async function searchMoviesWikipedia(query){
  const url = `https://it.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query + ' film')}&gsrlimit=20&prop=pageimages|pageterms&piprop=thumbnail&pithumbsize=400&format=json&origin=*`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Wikipedia ha risposto con errore ' + res.status);
  const data = await res.json();
  const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
  return pages
    .sort((a,b) => (a.index||0) - (b.index||0))
    .map(p => ({
      title: p.title,
      year: '',
      cover: p.thumbnail ? p.thumbnail.source : null,
    }));
}
async function searchSeriesTVmaze(query){
  const url = `https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('TVmaze ha risposto con errore ' + res.status);
  const data = await res.json();
  return (data || []).slice(0,20).map(r => ({
    title: r.show && r.show.name,
    year: r.show && r.show.premiered ? r.show.premiered.slice(0,4) : '',
    cover: r.show && r.show.image ? (r.show.image.original || r.show.image.medium) : null,
  })).filter(r => r.title);
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function searchJikan(query, attempt){
  // limit=25 è il massimo consentito da Jikan: la ricerca di MyAnimeList indicizza
  // titolo originale, titolo inglese e sinonimi (quindi "Attack on Titan" e
  // "Shingeki no Kyojin" trovano lo stesso risultato); un limite più alto riduce
  // i casi in cui il titolo giusto finiva "tagliato fuori" perché più in basso in classifica.
  const url = `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=25`;
  const res = await fetch(url);
  if(!res.ok){
    // Jikan va spesso in errore 429/5xx per rate limit o instabilità del server: riprova una volta.
    if((res.status === 429 || res.status >= 500) && attempt < 2){
      await sleep(1200);
      return searchJikan(query, attempt + 1);
    }
    throw new Error('Jikan ha risposto con errore ' + res.status);
  }
  const data = await res.json();
  return (data.data || []).map(r => ({
    title: r.title,
    // Mostriamo anche il titolo inglese quando differisce da quello originale,
    // così riconosci il risultato giusto anche se lo cerchi con l'altro nome.
    subtitle: (r.title_english && r.title_english !== r.title) ? r.title_english : '',
    year: r.year || (r.aired && r.aired.from ? r.aired.from.slice(0,4) : ''),
    cover: r.images && r.images.jpg ? r.images.jpg.image_url : null,
  }));
}
async function searchAnimeWikipedia(query){
  // Wikipedia in inglese ha una copertura di redirect per gli anime molto più ampia
  // di quella italiana (es. "Attack on Titan" e "Shingeki no Kyojin" portano alla
  // stessa voce), quindi funziona meglio come fallback sia per nomi inglesi che
  // per nomi giapponesi romanizzati.
  const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query + ' anime')}&gsrlimit=20&prop=pageimages|pageterms&piprop=thumbnail&pithumbsize=400&format=json&origin=*`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Wikipedia ha risposto con errore ' + res.status);
  const data = await res.json();
  const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
  return pages
    .sort((a,b) => (a.index||0) - (b.index||0))
    .map(p => ({ title: p.title, year: '', cover: p.thumbnail ? p.thumbnail.source : null }));
}
async function searchAnimeLegacy(query){
  try {
    const r = await searchJikan(query, 0);
    if(r.length > 0) return r;
    return await searchAnimeWikipedia(query);
  } catch(e){
    // Jikan momentaneamente giù dopo i retry: proviamo comunque con Wikipedia prima di arrenderci.
    return await searchAnimeWikipedia(query);
  }
}

// Funzioni usate dalla UI: provano TMDB per prime se c'è una chiave configurata,
// altrimenti (o se TMDB fallisce/non trova nulla) cadono sulle fonti di riserva.
async function searchMovies(query, apiKey){
  if(apiKey){
    try{ const r = await searchTMDB(query, 'movie', apiKey); if(r.length > 0) return r; }
    catch(e){ /* fallback qui sotto */ }
  }
  return await searchMoviesWikipedia(query);
}
async function searchSeries(query, apiKey){
  if(apiKey){
    try{ const r = await searchTMDB(query, 'tv', apiKey); if(r.length > 0) return r; }
    catch(e){ /* fallback qui sotto */ }
  }
  return await searchSeriesTVmaze(query);
}
async function searchAnime(query, apiKey){
  if(apiKey){
    try{ const r = await searchAnimeTMDB(query, apiKey); if(r.length > 0) return r; }
    catch(e){ /* fallback qui sotto */ }
  }
  return await searchAnimeLegacy(query);
}

// Suggerimento "cosa guardo stasera?": manda alla Gemini API di Google (Interactions API,
// chiamata diretta dal browser con la chiave personale dell'utente, come per TMDB) la
// watchlist e un estratto dei titoli già visti (con le note, solo per capire i gusti),
// e chiede di scegliere UN titolo dalla watchlist con una motivazione breve. La risposta è
// vincolata a uno schema JSON lato server (response_format), quindi non serve un parsing
// "a fiducia" su testo libero come con altri provider.
async function askGemini(pool, completed, apiKey){
  const payload = {
    watchlist: pool.map(i => ({ id: i.id, title: i.title, type: i.type, year: i.year || undefined })),
    completati_recenti: completed
      .slice()
      .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0))
      .slice(0, 40)
      .map(i => ({ title: i.title, type: i.type, nota: i.notes ? i.notes.slice(0, 140) : undefined })),
  };
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-goog-api-key': apiKey,
    },
    body: JSON.stringify({
      model: 'gemini-flash-latest',
      system_instruction: 'Sei un assistente che sceglie cosa guardare stasera da una watchlist personale. Riceverai un JSON con "watchlist" (titoli non ancora visti: id, title, type, year) e "completati_recenti" (titoli già visti, solo per capire i gusti: title, type, nota). Scegli ESATTAMENTE UNO dei titoli presenti in "watchlist" (mai uno dei completati, mai uno inventato).',
      input: JSON.stringify(payload),
      response_format: {
        type: 'text',
        mime_type: 'application/json',
        schema: {
          type: 'object',
          properties: {
            id: { type: 'string', description: 'id del titolo scelto, copiato esattamente da uno degli id in watchlist' },
            reason: { type: 'string', description: 'una frase in italiano, massimo 20 parole, che spiega la scelta' },
          },
          required: ['id', 'reason'],
        },
      },
    }),
  });
  if(!res.ok){
    let msg = 'Errore HTTP ' + res.status;
    if(res.status === 400 || res.status === 401 || res.status === 403) msg = 'Chiave API non valida. Controllala nelle impostazioni.';
    else if(res.status === 429) msg = 'Troppe richieste o credito esaurito su questa chiave API.';
    else{
      try{ const errBody = await res.json(); if(errBody && errBody.error && errBody.error.message) msg = errBody.error.message; }
      catch(e){ /* niente body leggibile, resta il messaggio generico */ }
    }
    throw new Error(msg);
  }
  const data = await res.json();
  if(data.errors && data.errors.length && data.errors[0].message){
    throw new Error(data.errors[0].message);
  }
  const modelStep = (data.steps || []).find(s => s.type === 'model_output');
  const textBlock = modelStep && (modelStep.content || []).find(c => c.type === 'text');
  if(!textBlock) throw new Error('Risposta senza testo dal modello (stato: ' + (data.status || 'sconosciuto') + ').');
  let parsed;
  try{ parsed = JSON.parse(textBlock.text); }
  catch(e){ throw new Error('Risposta del modello non interpretabile.'); }
  const chosen = pool.find(i => i.id === parsed.id);
  if(!chosen) throw new Error('Il modello ha scelto un titolo non presente in watchlist.');
  if(typeof parsed.reason !== 'string' || !parsed.reason.trim()) throw new Error('Risposta senza motivazione.');
  return { item: chosen, reason: parsed.reason.trim() };
}

function Poster({ src, title }){
  const [error, setError] = useState(false);
  const [loaded, setLoaded] = useState(false);
  if(!src || error){
    return <div className="poster-placeholder">{title || 'Nessuna copertina'}</div>;
  }
  return (
    <React.Fragment>
      {!loaded && <div className="poster-skeleton" aria-hidden="true"></div>}
      <img src={src} alt={title} onError={() => setError(true)} onLoad={() => setLoaded(true)}
        loading="lazy" style={{opacity: loaded ? 1 : 0}} />
    </React.Fragment>
  );
}

// Ricerca titoli condivisa tra AddModal (aggiunta) e CoverPickerModal (cambio copertina).
// Tiene la query, esegue la ricerca sulla fonte giusta in base al tipo e mostra i risultati
// con tante copertine tra cui scegliere.
function TitleSearch({ typeKey, initialQuery, autoFocus, tmdbApiKey, onPick }){
  const [query, setQuery] = useState(initialQuery || '');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const debounceRef = useRef(null);

  useEffect(() => {
    if(debounceRef.current) clearTimeout(debounceRef.current);
    if(query.trim().length < 2){ setResults([]); return; }
    debounceRef.current = setTimeout(async () => {
      setLoading(true); setErr('');
      try{
        let r;
        if(typeKey === 'anime') r = await searchAnime(query, tmdbApiKey);
        else if(typeKey === 'film') r = await searchMovies(query, tmdbApiKey);
        else r = await searchSeries(query, tmdbApiKey);
        setResults(r);
        if(r.length === 0){
          setErr('Nessun risultato automatico. Puoi aggiungere il titolo manualmente qui sotto.');
        }
      } catch(e){
        setErr('Ricerca non riuscita (' + (e && e.message ? e.message : 'errore sconosciuto') + '). Puoi comunque aggiungere il titolo manualmente qui sotto.');
      }
      setLoading(false);
    }, 450);
    return () => clearTimeout(debounceRef.current);
  }, [query, typeKey, tmdbApiKey]);

  return (
    <React.Fragment>
      <div className="field">
        <label>Cerca titolo</label>
        <input type="text" value={query} onChange={e => setQuery(e.target.value)}
          placeholder="Es. Il Padrino, Breaking Bad, Attack on Titan..." autoFocus={autoFocus} />
      </div>
      {loading && <div className="loading-row"><div className="spinner"></div>Cerco...</div>}
      {err && <div className="hint">{err}</div>}
      {results.length > 0 &&
        <div className="search-results">
          {results.map((r,i) => (
            <button key={i} className="search-result" onClick={() => onPick(r)}>
              {r.cover ? <img src={r.cover} alt="" /> : <div className="no-img" />}
              <div>
                <div className="search-result-title">{r.title}</div>
                {r.subtitle && <div className="search-result-year">{r.subtitle}</div>}
                {r.year && <div className="search-result-year">{r.year}</div>}
              </div>
            </button>
          ))}
        </div>
      }
    </React.Fragment>
  );
}

function SuggestModal({ items, apiKey, onClose, onOpenSettings }){
  const watchlist = useMemo(() => items.filter(i => i.status === 'watchlist'), [items]);
  const completed = useMemo(() => items.filter(i => i.status === 'completato'), [items]);
  const [typeFilter, setTypeFilter] = useState(() => new Set(TYPES.map(t => t.key)));
  const [ageFilter, setAgeFilter] = useState('any');
  const [started, setStarted] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(!apiKey ? 'missing-key' : (watchlist.length === 0 ? 'empty-watchlist' : ''));
  const [suggestion, setSuggestion] = useState(null);
  const excludeRef = useRef([]);

  const canSearch = err !== 'missing-key' && err !== 'empty-watchlist';

  function toggleType(key){
    setTypeFilter(prev => {
      const next = new Set(prev);
      if(next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  }
  function matchesAge(item){
    if(ageFilter === 'any') return true;
    const day = 24 * 3600 * 1000;
    const age = Date.now() - (item.addedAt || 0);
    if(ageFilter === 'lt6m') return age < 182 * day;
    if(ageFilter === 'gt6m') return age >= 182 * day;
    if(ageFilter === 'gt1y') return age >= 365 * day;
    if(ageFilter === 'gt2y') return age >= 730 * day;
    return true;
  }

  async function ask(){
    setStarted(true);
    const basePool = watchlist.filter(i => typeFilter.has(i.type) && matchesAge(i));
    if(basePool.length === 0){ setErr('no-match'); setSuggestion(null); return; }
    const pool = basePool.filter(i => !excludeRef.current.includes(i.id));
    if(pool.length === 0){ setErr('exhausted'); setSuggestion(null); return; }
    setLoading(true); setErr(''); setSuggestion(null);
    try{
      const picked = await askGemini(pool, completed, apiKey);
      setSuggestion(picked);
    } catch(e){
      setErr((e && e.message) ? e.message : 'Richiesta non riuscita.');
    }
    setLoading(false);
  }
  function findClick(){ excludeRef.current = []; ask(); }
  function another(){
    if(suggestion) excludeRef.current = [...excludeRef.current, suggestion.item.id];
    ask();
  }

  const isGenericError = err && !['missing-key', 'empty-watchlist', 'no-match', 'exhausted'].includes(err);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Cosa guardo stasera?</h2>
          <button className="icon-btn" onClick={onClose} aria-label="Chiudi">✕</button>
        </div>

        {err === 'missing-key' && (
          <div>
            <div className="hint">Questa funzione usa Gemini per scegliere un titolo dalla tua watchlist, ma serve una chiave API Gemini personale — non ne è ancora stata configurata una.</div>
            <button className="btn primary" style={{width:'100%', marginTop:12, background:'var(--serie)'}} onClick={onOpenSettings}>Apri impostazioni</button>
          </div>
        )}
        {err === 'empty-watchlist' && (
          <div className="hint">La watchlist è vuota: aggiungi qualche titolo prima di chiedere un suggerimento.</div>
        )}

        {canSearch && (
          <div className="field">
            <label>Filtra prima di chiedere</label>
            <div className="filters" style={{marginBottom:8}}>
              {TYPES.map(t => (
                <button key={t.key} type="button" className={"chip" + (typeFilter.has(t.key) ? ' active' : '')}
                  style={typeFilter.has(t.key) ? {background: t.accent} : {}}
                  onClick={() => toggleType(t.key)}>{t.label}</button>
              ))}
            </div>
            <select value={ageFilter} onChange={e => setAgeFilter(e.target.value)}>
              <option value="any">Da quanto tempo in watchlist: qualsiasi</option>
              <option value="lt6m">Aggiunti da meno di 6 mesi</option>
              <option value="gt6m">Aggiunti da più di 6 mesi</option>
              <option value="gt1y">Aggiunti da più di 1 anno</option>
              <option value="gt2y">Aggiunti da più di 2 anni</option>
            </select>
          </div>
        )}

        {started && err === 'no-match' && (
          <div className="hint">Nessun titolo in watchlist corrisponde ai filtri scelti.</div>
        )}
        {started && err === 'exhausted' && (
          <div className="hint">Hai scartato tutti i titoli suggeribili con questi filtri.</div>
        )}
        {loading && <div className="loading-row"><div className="spinner"></div>Sto scegliendo...</div>}
        {!loading && isGenericError && <div className="hint">{err}</div>}
        {!loading && suggestion && (
          <div>
            <div style={{maxWidth:160, margin:'0 auto'}}>
              <Poster src={suggestion.item.cover} title={suggestion.item.title} />
            </div>
            <div className="card-title" style={{textAlign:'center', marginTop:10, fontSize:'1.05em'}}>{suggestion.item.title}</div>
            {suggestion.item.year && <div className="hint" style={{textAlign:'center', marginTop:2}}>{suggestion.item.year}</div>}
            <div className="hint" style={{marginTop:12, fontStyle:'italic', textAlign:'center'}}>"{suggestion.reason}"</div>
          </div>
        )}

        {canSearch && (
          <div className="btn-row" style={{marginTop:16}}>
            <button className="btn" onClick={findClick} disabled={loading}>{started ? 'Cerca di nuovo' : 'Trova un titolo'}</button>
            {suggestion && !loading && <button className="btn" onClick={another}>Un altro suggerimento</button>}
            <button className="btn primary" style={{background:'var(--serie)'}} onClick={onClose}>Chiudi</button>
          </div>
        )}
        {!canSearch && (
          <div className="btn-row" style={{marginTop:16}}>
            <button className="btn primary" style={{background:'var(--serie)'}} onClick={onClose}>Chiudi</button>
          </div>
        )}
      </div>
    </div>
  );
}

function SettingsModal({ settings, items, onImport, onClose, onSave }){
  const [theme, setTheme] = useState(settings.theme);
  const [tmdbApiKey, setTmdbApiKey] = useState(settings.tmdbApiKey || '');
  const [geminiApiKey, setGeminiApiKey] = useState(settings.geminiApiKey || '');
  const [backupMsg, setBackupMsg] = useState('');
  const fileInputRef = useRef(null);
  function save(){ onSave({ theme, tmdbApiKey: tmdbApiKey.trim(), geminiApiKey: geminiApiKey.trim() }); onClose(); }
  function exportBackup(){
    const payload = { app: 'watch-tracker', version: 1, exportedAt: new Date().toISOString(), items };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `watch-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setBackupMsg(`Backup esportato: ${items.length} titoli.`);
  }
  function handleImportFile(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        const list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.items)) ? parsed.items : null;
        if(!list) throw new Error('invalid');
        const result = onImport(list);
        setBackupMsg(
          `Importati ${result.added} titoli.` +
          (result.skipped ? ` ${result.skipped} già presenti (saltati).` : '') +
          (result.invalid ? ` ${result.invalid} non validi (ignorati).` : '')
        );
      } catch(err){
        setBackupMsg('Import fallito: il file non è un backup valido di Watch Tracker.');
      }
    };
    reader.readAsText(file);
  }
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Impostazioni</h2>
          <button className="icon-btn" onClick={onClose} aria-label="Chiudi">✕</button>
        </div>
        <div className="field">
          <label>Tema</label>
          <div className="theme-toggle">
            <button className={theme==='dark' ? 'active':''} onClick={() => setTheme('dark')}>Scuro</button>
            <button className={theme==='light' ? 'active':''} onClick={() => setTheme('light')}>Chiaro</button>
          </div>
        </div>
        <div className="field">
          <label>Chiave API TMDB (opzionale)</label>
          <input type="password" value={tmdbApiKey} onChange={e => setTmdbApiKey(e.target.value)}
            placeholder="Incolla qui la tua API key" />
          <div className="hint">
            Con una chiave TMDB le copertine sono più curate e uniformi per film, serie e anime.
            Puoi ottenerne una gratis in pochi minuti su <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer">themoviedb.org/settings/api</a> (serve solo un account gratuito).
            Senza chiave l'app continua a funzionare usando Wikipedia, TVmaze e MyAnimeList.
          </div>
        </div>
        <div className="field">
          <label>Chiave API Gemini (opzionale)</label>
          <input type="password" value={geminiApiKey} onChange={e => setGeminiApiKey(e.target.value)}
            placeholder="Incolla qui la tua API key" />
          <div className="hint">
            Serve solo per "Cosa guardo stasera?" 🎲, il suggerimento AI dalla tua watchlist.
            Puoi crearne una gratis su <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a> (Google offre un livello gratuito con limiti di frequenza; controlla i limiti aggiornati in AI Studio).
            La chiamata parte direttamente da questo browser verso Google, senza passare da server intermedi; la chiave resta comunque salvata in chiaro qui sul dispositivo, come quella TMDB.
          </div>
        </div>
        <div className="field">
          <label>Backup dati</label>
          <div className="btn-row">
            <button type="button" className="btn" onClick={exportBackup}>Esporta backup (JSON)</button>
            <button type="button" className="btn" onClick={() => fileInputRef.current && fileInputRef.current.click()}>Importa backup</button>
            <input ref={fileInputRef} type="file" accept="application/json" style={{display:'none'}} onChange={handleImportFile} />
          </div>
          <div className="hint">
            Tutti i dati sono salvati solo su questo dispositivo/browser: cancellando i dati del browser si perdono per sempre.
            Esporta un backup ogni tanto e conservalo (es. su cloud); "Importa" aggiunge i titoli del file senza cancellare quelli già presenti.
          </div>
          {backupMsg && <div className="hint" style={{color:'var(--text)'}}>{backupMsg}</div>}
        </div>
        <button className="btn primary" style={{width:'100%', background:'var(--serie)', marginTop:14}} onClick={save}>Salva impostazioni</button>
      </div>
    </div>
  );
}

    const q = searchQuery.trim().toLowerCase();
    const list = items.filter(i => i.type === activeType && i.status === filter
      && (!q || i.title.toLowerCase().includes(q)));
    const sorted = list.slice();
    if(sortBy === 'alpha') sorted.sort((a, b) => a.title.localeCompare(b.title, 'it', { sensitivity: 'base' }));
    else sorted.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
    return sorted;
  }, [items, activeType, filter, searchQuery, sortBy]);

  function addItem({ title, cover, year }){
    setItems(prev => [...prev, {
      id: uid(), type: activeType, title, cover, year,
      status: 'completato', notes: '', addedAt: Date.now(),
    }]);
    setShowAdd(false);
  }
  function saveItem(updated){
    setItems(prev => prev.map(i => i.id === updated.id ? updated : i));
  }
  function deleteItem(id){
    setItems(prev => prev.filter(i => i.id !== id));
  }
  function importItems(rawList){
    const validTypes = TYPES.map(t => t.key);
    const validStatuses = Object.keys(STATUS);
    const existingIds = new Set(items.map(i => i.id));
    let skipped = 0, invalid = 0;
    const toAdd = [];
    rawList.forEach(raw => {
      if(!raw || typeof raw !== 'object'){ invalid++; return; }
      const title = typeof raw.title === 'string' ? raw.title.trim() : '';
      if(!validTypes.includes(raw.type) || !validStatuses.includes(raw.status) || !title){ invalid++; return; }
      const id = (typeof raw.id === 'string' && raw.id) ? raw.id : uid();
      if(existingIds.has(id)){ skipped++; return; }
      existingIds.add(id);
      toAdd.push({
        id, type: raw.type, title, cover: typeof raw.cover === 'string' ? raw.cover : '',
        year: raw.year || '', status: raw.status,
        notes: typeof raw.notes === 'string' ? raw.notes : '',
        addedAt: Number.isFinite(raw.addedAt) ? raw.addedAt : Date.now(),
      });
    });
    if(toAdd.length) setItems(prev => [...prev, ...toAdd]);
    return { added: toAdd.length, skipped, invalid };
  }

  return (
    <div className="app">
      <div className="header">
        <div className="brand">
          <div className="brand-mark">W</div>
          <h1>Watch Tracker</h1>
        </div>
        <div style={{display:'flex', gap:8}}>
          <button className="icon-btn" onClick={() => setShowSuggest(true)} aria-label="Cosa guardo stasera?" title="Cosa guardo stasera?">
            <IconDice />
          </button>
          <button className="icon-btn" onClick={() => setShowSettings(true)} aria-label="Impostazioni" title="Impostazioni">
            <IconSettings />
          </button>
        </div>
      </div>

      <div className="tabs">
        {TYPES.map(t => {
          const count = items.filter(i => i.type === t.key).length;
          return (
            <button key={t.key} className={"tab" + (activeType===t.key ? ' active':'')}
              style={activeType===t.key ? {borderBottomColor: t.accent} : {}}
              onClick={() => { setActiveType(t.key); }}>
              {t.label}<span className="count">{count}</span>
            </button>
          );
        })}
      </div>

      <div className="search-row">
        <input type="text" className="search-input" value={searchQuery}
          onChange={e => setSearchQuery(e.target.value)}
          placeholder={`Cerca tra i ${typeInfo.label.toLowerCase()}...`} />
      </div>

      <div className="toolbar">
        <div className="filters">
          {Object.keys(STATUS).map(s => (
            <button key={s} className={"chip"+(filter===s?' active':'')}
              style={filter===s ? {background: typeInfo.accent} : {}}
              onClick={() => setFilter(s)}>{STATUS[s].label}</button>
          ))}
        </div>
        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <select className="sort-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="recent">Più recenti</option>
            <option value="alpha">Alfabetico</option>
          </select>
          <button className="add-btn" style={{background: typeInfo.accent}} onClick={() => setShowAdd(true)}>+ Aggiungi</button>
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">
          <div className="empty-icon"><IconFilmReel /></div>
          <div className="display">Nessun titolo qui</div>
          <div>{searchQuery.trim() ? 'Nessun risultato per questa ricerca.' : `Aggiungi il primo ${typeInfo.label.toLowerCase()} alla tua libreria.`}</div>
        </div>
      ) : (
        <div className="grid">
          {filtered.map(item => (
            <div key={item.id} className="card" onClick={() => setDetailItem(item)}>
              <div className="poster-wrap">
                <Poster src={item.cover} title={item.title} />
                <div className="status-dot" style={{background: STATUS[item.status].color}}></div>
              </div>
              <div className="card-info">
                <div className="card-title">{item.title}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {showAdd && <AddModal typeKey={activeType} tmdbApiKey={settings.tmdbApiKey}
        onClose={() => setShowAdd(false)} onAdd={addItem} />}
      {detailItem && <DetailModal item={detailItem} typeKey={detailItem.type} typeAccent={typeInfo.accent} tmdbApiKey={settings.tmdbApiKey}
        onClose={() => setDetailItem(null)} onSave={saveItem} onDelete={deleteItem} />}
      {showSettings && <SettingsModal settings={settings} items={items} onImport={importItems}
        onClose={() => setShowSettings(false)} onSave={setSettings} />}
      {showSuggest && <SuggestModal items={items} apiKey={settings.geminiApiKey}
        onClose={() => setShowSuggest(false)}
        onOpenSettings={() => { setShowSuggest(false); setShowSettings(true); }} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
document.getElementById('root').dataset.mounted = 'true';
</script>
</body>
</html>
